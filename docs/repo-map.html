  applyd repo mind map — single-file, no dependencies, works from file://.

  UPDATE DISCIPLINE (rule in AGENTS.md → Stack and Conventions): whenever the
  repo's structure changes — a script added/removed/renamed, an import edge or
  data flow changed, a routine or mode added — edit the N (nodes) and E (edges)
  arrays below in the same session. Content-only edits (CV wording, config
  values, report text) do not require a map update; anything a fresh session
  needs in order to navigate the codebase does.

main{flex:1;position:relative;overflow:hidden}

  {s:'em_a',t:'em_m',y:'import'},{s:'em_a',t:'not',y:'data'},{s:'em_a',t:'amd',y:'data'},
  {s:'em_p',t:'em_s',y:'import'},{s:'em_p',t:'em_m',y:'import'},

  // Tests → subjects
  {s:'ta',t:'tnr',y:'routine'},{s:'ta',t:'tbc',y:'routine'},{s:'ta',t:'tse',y:'routine'},
  {s:'ta',t:'trt',y:'routine'},{s:'ta',t:'tlg',y:'routine'},{s:'ta',t:'tem',y:'routine'},
  {s:'tnr',t:'nrt',y:'import'},{s:'tbc',t:'bcv',y:'import'},{s:'tse',t:'sev',y:'import'},
  {s:'trt',t:'rtx',y:'import'},{s:'tlg',t:'clg2',y:'import'},{s:'tem',t:'em_m',y:'import'},

  // Hook
  {s:'hpc',t:'ta',y:'routine'},

  // Schedule example
  {s:'nsex',t:'rw',y:'routine'},
];

// Build lookup + adjacency
const byId=Object.create(null);
N.forEach(n=>{byId[n.id]=n});
const adj=Object.create(null);
N.forEach(n=>{adj[n.id]=new Set});
E.forEach(e=>{adj[e.s].add(e.t);adj[e.t].add(e.s)});

// Degree for radius
N.forEach(n=>{
  const deg=E.filter(e=>e.s===n.id||e.t===n.id).length;
  n.r=n.c==='pipeline'?14:Math.max(5,Math.min(14,3+deg*1.1));
});

// Initial positions — cluster by category
const CP={
  pipeline:[0,0],
  entry:  [-520, -260],
  ingest: [-380,  20],
  build:  [ 280, -120],
  data:   [-160,  310],
  auto:   [ 420, -260],
  infra:  [ 200,  260],
};
const stageY={s1:-200,s2:-100,s3:0,s4:100,s5:200};
N.forEach(n=>{
  if(stageY[n.id]!=null){n.x=0;n.y=stageY[n.id]}
  else{const[cx,cy]=CP[n.c]||[0,0];n.x=cx+(Math.random()-.5)*220;n.y=cy+(Math.random()-.5)*220}
  n.vx=0;n.vy=0;n.visible=true;n.dim=false;
});

// Physics
const REP=2400,SPR=.022,REST=115,GRAV=.007,DAMP=.82;
function tick(){
  for(let i=0;i<N.length;i++){
    const a=N[i];if(!a.visible||a.pinned)continue;
    let fx=0,fy=0;
    for(let j=0;j<N.length;j++){
      if(i===j||!N[j].visible)continue;
      const dx=a.x-N[j].x,dy=a.y-N[j].y;
      const d2=dx*dx+dy*dy+1,d=Math.sqrt(d2);
      const f=REP/d2;fx+=f*dx/d;fy+=f*dy/d;
    }
    for(const e of E){
      let other=null;
      if(e.s===a.id)other=byId[e.t];
      else if(e.t===a.id)other=byId[e.s];
      if(!other||!other.visible)continue;
      const dx=other.x-a.x,dy=other.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=SPR*(d-REST);fx+=f*dx/d;fy+=f*dy/d;
    }
    fx-=a.x*GRAV;fy-=a.y*GRAV;
    a.vx=(a.vx+fx)*DAMP;a.vy=(a.vy+fy)*DAMP;
    a.x+=a.vx;a.y+=a.vy;
  }
}

// Run initial settle
for(let i=0;i<320;i++)tick();

// Canvas setup
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const dpr=devicePixelRatio||1;
let W,H,zoom=1,panX=0,panY=0;
function resize(){
  const r=cvs.getBoundingClientRect();W=r.width;H=r.height;
  cvs.width=W*dpr;cvs.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
addEventListener('resize',resize);

function zoomFit(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const n of N){if(!n.visible)continue;x0=Math.min(x0,n.x-80);x1=Math.max(x1,n.x+140);y0=Math.min(y0,n.y-30);y1=Math.max(y1,n.y+30)}
  const gw=x1-x0||1,gh=y1-y0||1;
  zoom=Math.min(W/gw,H/gh)*.88;zoom=Math.min(Math.max(zoom,.15),2.5);
  panX=-(x0+x1)/2*zoom;panY=-(y0+y1)/2*zoom;
}
zoomFit();

function s2g(sx,sy){return{x:(sx-panX-W/2)/zoom,y:(sy-panY-H/2)/zoom}}
function findAt(gx,gy){
  for(let i=N.length-1;i>=0;i--){
    const n=N[i];if(!n.visible)continue;
    const dx=n.x-gx,dy=n.y-gy;
    if(dx*dx+dy*dy<(n.r+4)*(n.r+4))return n;
  }return null;
}

// State
let hovered=null,selected=null,dragging=null,panning=false,mx=0,my=0,simRunning=false,simTicks=0;
const catVis=Object.create(null);
Object.keys(CATS).forEach(k=>{catVis[k]=true});
let searchQ='';

// Filters
const filtersEl=document.getElementById('filters');
Object.entries(CATS).forEach(([k,v])=>{
  const b=document.createElement('button');b.className='fbtn';b.dataset.cat=k;
  b.innerHTML=`<span class="dot" style="background:${v.dark}"></span>${v.label}`;
  b.onclick=()=>{catVis[k]=!catVis[k];b.classList.toggle('off',!catVis[k]);applyVis()};
  filtersEl.appendChild(b);
});

function applyVis(){
  for(const n of N){
    n.visible=catVis[n.c]&&(!searchQ||n.l.toLowerCase().includes(searchQ)||(n.d||'').toLowerCase().includes(searchQ));
    n.dim=!!searchQ&&!n.l.toLowerCase().includes(searchQ)&&!(n.d||'').toLowerCase().includes(searchQ);
  }
}

// Search
const searchEl=document.getElementById('search');
searchEl.addEventListener('input',()=>{searchQ=searchEl.value.trim().toLowerCase();applyVis()});
addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==searchEl){e.preventDefault();searchEl.focus()}
  if(e.key==='Escape'){searchEl.value='';searchQ='';applyVis();hidePanel();searchEl.blur()}
  if(e.key==='f'&&document.activeElement!==searchEl)zoomFit();
});

// Edge style
const ESTYLE={
  pipeline:{w:2.5,dash:[],alpha:.6},
  import:  {w:1.2,dash:[],alpha:.25},
  data:    {w:1,  dash:[6,4],alpha:.2},
  routine: {w:1,  dash:[2,3],alpha:.2},
};
const ECOLOR={
  pipeline:()=>catColor('pipeline'),
  import:()=>catColor('build'),
  data:()=>catColor('data'),
  routine:()=>catColor('auto'),
};

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(panX+W/2,panY+H/2);ctx.scale(zoom,zoom);

  const focusId=hovered?.id||selected?.id||null;
  const connSet=new Set;
  if(focusId){adj[focusId].forEach(id=>connSet.add(id));connSet.add(focusId)}

  // Edges
  for(const e of E){
    const ns=byId[e.s],nt=byId[e.t];
    if(!ns||!nt||!ns.visible||!nt.visible)continue;
    const es=ESTYLE[e.y],ec=ECOLOR[e.y]();
    let alpha=es.alpha;
    if(focusId){
      if(e.s===focusId||e.t===focusId)alpha=Math.min(alpha*3,.8);
      else alpha*=.15;
    }
    ctx.beginPath();ctx.strokeStyle=ec;ctx.globalAlpha=alpha;ctx.lineWidth=es.w/Math.max(zoom,.5);
    ctx.setLineDash(es.dash.map(d=>d/Math.max(zoom,.5)));
    const dx=nt.x-ns.x,dy=nt.y-ns.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const cx2=(ns.x+nt.x)/2+(-dy/d)*d*.1,cy2=(ns.y+nt.y)/2+(dx/d)*d*.1;
    ctx.moveTo(ns.x,ns.y);ctx.quadraticCurveTo(cx2,cy2,nt.x,nt.y);ctx.stroke();
    // Arrow
    if(e.y==='pipeline'||e.y==='routine'){
      const ang=Math.atan2(nt.y-cy2,nt.x-cx2);
      const ax=nt.x-Math.cos(ang)*(nt.r+2),ay=nt.y-Math.sin(ang)*(nt.r+2);
      const sz=e.y==='pipeline'?6:4;
      ctx.fillStyle=ec;
      ctx.beginPath();ctx.moveTo(ax,ay);
      ctx.lineTo(ax-Math.cos(ang-0.4)*sz,ay-Math.sin(ang-0.4)*sz);
      ctx.lineTo(ax-Math.cos(ang+0.4)*sz,ay-Math.sin(ang+0.4)*sz);
      ctx.closePath();ctx.fill();
    }
    ctx.setLineDash([]);ctx.globalAlpha=1;
  }

  // Nodes
  for(const n of N){
    if(!n.visible)continue;
    const cc=catColor(n.c);
    let alpha=1;
    if(focusId&&!connSet.has(n.id))alpha=.12;
    if(n.dim)alpha=.15;
    ctx.globalAlpha=alpha;

    // Glow
    if(n.id===focusId){
      ctx.shadowColor=cc;ctx.shadowBlur=16;
    }
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=cc;ctx.fill();
    if(n.c==='pipeline'){ctx.strokeStyle=cc;ctx.lineWidth=2;ctx.stroke()}
    ctx.shadowBlur=0;

    // Label
    const fs=n.r>10?12:10.5;
    ctx.font=`500 ${fs}px ui-monospace,'Cascadia Code','SF Mono',monospace`;
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle=focusId&&!connSet.has(n.id)?cc:cc;
    ctx.fillText(n.l,n.x+n.r+6,n.y);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

// Animation loop
let raf;
function loop(){draw();raf=requestAnimationFrame(loop)}
loop();

// Sim runner (on drag)
function runSim(ticks){simRunning=true;simTicks=ticks;(function go(){if(simTicks--<=0){simRunning=false;return}tick();requestAnimationFrame(go)})()}

// Mouse interaction
cvs.addEventListener('pointerdown',e=>{
  const r=cvs.getBoundingClientRect();
  const sx=e.clientX-r.left,sy=e.clientY-r.top;
  const g=s2g(sx,sy);const n=findAt(g.x,g.y);
  if(n){dragging=n;n.pinned=true;cvs.classList.add('dragging')}
  else{panning=true;mx=e.clientX;my=e.clientY;cvs.classList.add('dragging')}
  document.getElementById('hint')?.classList.add('gone');
  setTimeout(()=>document.getElementById('hint')?.remove(),1000);
});
addEventListener('pointermove',e=>{
  const r=cvs.getBoundingClientRect();
  const sx=e.clientX-r.left,sy=e.clientY-r.top;
  if(dragging){
    const g=s2g(sx,sy);dragging.x=g.x;dragging.y=g.y;
    if(!simRunning)runSim(60);
  }else if(panning){
    panX+=e.clientX-mx;panY+=e.clientY-my;mx=e.clientX;my=e.clientY;
  }else{
    const g=s2g(sx,sy);hovered=findAt(g.x,g.y);
    cvs.style.cursor=hovered?'pointer':'grab';
  }
});
addEventListener('pointerup',e=>{
  if(dragging){
    dragging.pinned=false;
    const r=cvs.getBoundingClientRect();
    const g=s2g(e.clientX-r.left,e.clientY-r.top);
    const hit=findAt(g.x,g.y);
    if(hit)selectNode(hit);
    dragging=null;
  }
  panning=false;cvs.classList.remove('dragging');
});
cvs.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=cvs.getBoundingClientRect();
  const sx=e.clientX-r.left,sy=e.clientY-r.top;
  const g=s2g(sx,sy);
  const factor=e.deltaY>0?.88:1/.88;
  const nz=Math.min(Math.max(zoom*factor,.12),4);
  panX=sx-W/2-(g.x*nz);panY=sy-H/2-(g.y*nz);zoom=nz;
},{passive:false});

// Detail panel
const panel=document.getElementById('panel');
const panelBody=document.getElementById('panel-body');
document.getElementById('close-panel').onclick=hidePanel;

function selectNode(n){
  selected=n;showPanel(n);
  const tx=-n.x*zoom,ty=-n.y*zoom;
  const dx=tx-panX,dy=ty-panY;
  let f=0;
  (function ani(){f+=.08;if(f>=1)f=1;
    panX+=dx*.08;panY+=dy*.08;if(f<1)requestAnimationFrame(ani)})();
}

function showPanel(n){
  const cc=catColor(n.c);
  let h=`<h2 style="color:${cc}">${esc(n.l)}</h2>`;
  h+=`<span class="badge" style="background:${cc}22;color:${cc}">${CATS[n.c].label}</span>`;
  if(n.t)h+=`<span class="badge" style="background:var(--border);color:var(--text-2);margin-left:4px">${n.t}</span>`;
  h+=`<p class="desc">${esc(n.d||'')}</p>`;
  if(n.p)h+=`<div class="path-row">${esc(n.p)}</div>`;

  const out=[],inc=[];
  for(const e of E){
    if(e.s===n.id&&byId[e.t])out.push({node:byId[e.t],type:e.y});
    if(e.t===n.id&&byId[e.s])inc.push({node:byId[e.s],type:e.y});
  }
  if(out.length){
    h+='<div class="conn-group"><div class="conn-label">→ Outgoing</div>';
    out.forEach(c=>{
      h+=`<div class="conn-item" data-id="${c.node.id}" style="color:${catColor(c.node.c)}">`;
      h+=`<span style="opacity:.4;font-size:10px">${c.type}</span> ${esc(c.node.l)}</div>`;
    });h+='</div>';
  }
  if(inc.length){
    h+='<div class="conn-group"><div class="conn-label">← Incoming</div>';
    inc.forEach(c=>{
      h+=`<div class="conn-item" data-id="${c.node.id}" style="color:${catColor(c.node.c)}">`;
      h+=`<span style="opacity:.4;font-size:10px">${c.type}</span> ${esc(c.node.l)}</div>`;
    });h+='</div>';
  }
  panelBody.innerHTML=h;
  panel.classList.add('open');
  panelBody.querySelectorAll('.conn-item').forEach(el=>{
    el.onclick=()=>{const nd=byId[el.dataset.id];if(nd)selectNode(nd)};
  });
}
function hidePanel(){panel.classList.remove('open');selected=null}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// Theme change listener
function onTheme(){draw()}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',onTheme);
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// Auto-hide hint
setTimeout(()=>document.getElementById('hint')?.classList.add('gone'),5000);
</script>
